
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALC Smart Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #24364b;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 25px 35px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #cbd8e7;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .card h3 {
            color: #718096;
            font-size: 14px;
            margin-top: 0;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #18395f;
        }

        .passed {
            color: #16865b;
        }

        .improvement {
            color: #c17a20;
        }

        .table-card {
            margin-top: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 550px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5eaf0;
        }

        th {
            color: #718096;
            font-size: 13px;
        }

        .status {
            font-weight: bold;
        }

        .status-passed {
            color: #16865b;
        }

        .status-improvement {
            color: #c17a20;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #8a98a9;
        }

        @media (max-width: 750px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ALC Smart Learning</h1>
    <p>Learning & Development Platform</p>
</header>

<main class="container">

    <h2>DLP Assessment Dashboard</h2>
    <p>Learning and competency performance overview</p>

    <section class="cards">

        <div class="card">
            <h3>Total Participants</h3>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <h3>Passed</h3>
            <div class="number passed" id="passed">0</div>
        </div>

        <div class="card">
            <h3>Need Improvement</h3>
            <div class="number improvement" id="improvement">0</div>
        </div>

        <div class="card">
            <h3>Passing Rate</h3>
            <div class="number" id="rate">0%</div>
        </div>

    </section>

    <section class="card table-card">

        <h2>Participant Assessment</h2>
<input
    type="text"
    id="searchInput"
    placeholder="Search participant name..."
    style="width:100%; max-width:360px; padding:12px; margin:10px 0; border:1px solid #d9e2ec; border-radius:8px;"
>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Score</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="participantTable"></tbody>
        </table>

    </section>

</main>

<footer class="footer">
    ALC Smart Learning | Learning & Development
</footer>

<script>

// 1. Sample participant data
const participants = [
    { name: "Andi", department: "Biodiesel", score: 85 },
    { name: "Budi", department: "Refinery", score: 75 },
    { name: "Citra", department: "KCP", score: 90 },
    { name: "Deni", department: "Oleochemical", score: 70 },
    { name: "Eka", department: "Biodiesel", score: 88 },
    { name: "Fajar", department: "Refinery", score: 65 },
    { name: "Gita", department: "KCP", score: 82 },
    { name: "Hana", department: "Oleochemical", score: 95 }
];

// 2. Set passing score
const passingScore = 80;

// 3. Calculate dashboard data
const total = participants.length;

const passed = participants.filter(
    person => person.score >= passingScore
).length;

const improvement = total - passed;

const rate = total === 0
    ? 0
    : (passed / total) * 100;

// 4. Display dashboard numbers
document.getElementById("total").textContent = total;

document.getElementById("passed").textContent = passed;

document.getElementById("improvement").textContent = improvement;

document.getElementById("rate").textContent =
    rate.toFixed(1) + "%";

// 5. Display participant table
const table = document.getElementById("participantTable");

participants.forEach(person => {

    const isPassed = person.score >= passingScore;

    const status = isPassed
        ? "Passed"
        : "Need Improvement";

    const statusClass = isPassed
        ? "status-passed"
        : "status-improvement";

    const row = document.createElement("tr");

    const nameCell = document.createElement("td");
    nameCell.textContent = person.name;

    const departmentCell = document.createElement("td");
    departmentCell.textContent = person.department;

    const scoreCell = document.createElement("td");
    scoreCell.textContent = person.score;

    const statusCell = document.createElement("td");
    statusCell.textContent = status;
    statusCell.className = "status " + statusClass;

    row.appendChild(nameCell);
    row.appendChild(departmentCell);
    row.appendChild(scoreCell);
    row.appendChild(statusCell);

    table.appendChild(row);
});
// 6. Search participant by name

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", function() {

    const keyword = searchInput.value.toLowerCase();

    const rows = table.querySelectorAll("tr");

    rows.forEach(row => {

        const name = row.cells[0].textContent.toLowerCase();

        if (name.includes(keyword)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });

});
</script>

</body>
</html>
